name: Demo CI

on:
  push:
    branches: [main, feature/campus-medical-response]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test demo API and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused API tests
        run: pytest tests/test_data_api.py tests/test_data_api_router.py tests/test_cors.py -q

      - name: Check Python modules compile
        run: python -m py_compile app/dynamo_demo_repository.py app/routers/data_api_demo.py

      - name: Check frontend JavaScript parses
        run: node --check frontend/medical.js

      - name: Check Lambda container builds
        run: docker build -f Dockerfile.lambda -t campus-medical-demo:ci .
