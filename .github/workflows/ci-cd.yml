name: Demo CI

on:
  push:
    branches: [main, feature/campus-medical-response]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test demo API and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-unique-characters-12345
      GUEST_TOKEN_SECRET: ci-guest-secret-with-more-than-thirty-two-unique-characters-67890
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests -q

      - name: Check Python modules compile
        run: python -m py_compile app/dynamo_demo_repository.py app/routers/data_api_demo.py

      - name: Check frontend JavaScript and configuration
        run: |
          for script in frontend/*.js; do node --check "$script" || exit; done
          node --test tests/test_frontend_config.js tests/test_geolocation_retry.js

      - name: Check Lambda container builds
        run: docker build -f Dockerfile.lambda -t campus-medical-demo:ci .
